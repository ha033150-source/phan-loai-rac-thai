<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cho Cuộc Sống Xanh</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Thiết lập nền và font chữ chung */
        body {
            margin: 0;
            padding: 0;
            background-color: #e8f5e9; /* Xanh lá cây nhạt */
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. Thanh tác vụ nhỏ bên trên */
        .top-bar {
            font-size: 14px;
            color: #2e7d32;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. Tiêu đề chính */
        .main-title {
            font-family: 'Noto Serif Display', serif;
            font-size: 48px;
            margin: 10px 0 30px 0;
            color: #000; /* "AI cho" màu đen */
        }
        .main-title span {
            color: #4caf50; /* "cuộc sống xanh" màu xanh lá */
        }

        /* 4. Khung bao màu Beige chứa nội dung chính */
        .app-container {
            background-color: #f5f5dc; /* Màu Beige */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 90%;
            border: 2px solid #dcdcaa;
        }

        /* Khung hiển thị Webcam */
        #webcam-container {
            border: 8px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: #000;
            margin-bottom: 20px;
        }

        /* Nút Start */
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        button:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
        }

        /* 5. Khu vực hiển thị nhãn rác */
        #label-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #label-container div {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #e0e0ce;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }

        /* Class để in đậm khi > 60% */
        .high-confidence {
            background-color: #ffffff !important;
            border: 2px solid #4caf50 !important;
            font-weight: bold;
            color: #1b5e20;
            transform: scale(1.02);
        }

        /* 6. Footer hướng dẫn */
        .footer-link {
            margin-top: 30px;
            font-size: 16px;
            color: #555;
        }
        .footer-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #4caf50;
        }
        .footer-link a:hover {
            color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="top-bar">Phân loại rác thải tự động</div>
    
    <h1 class="main-title">AI cho <span>cuộc sống xanh</span></h1>

    <div class="app-container">
        <button type="button" onclick="init()">Bắt đầu nhận diện</button>
        
        <div id="webcam-container"></div>
        
        <div id="label-container">
            </div>
    </div>

    <div class="footer-link">
        Tham khảo cách xử lý rác <a href="https://canva.link/vjjnoiq5v52rytr" target="_blank">tại đây</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // THAY LINK MODEL CỦA M VÀO ĐÂY
        const URL = "https://teachablemachine.withgoogle.com/models/KfJ6e8utrB/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(320, 320, flip); // Tăng kích thước lên 320 cho đẹp
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // Clear cũ
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const probability = prediction[i].probability;
                const classText = prediction[i].className + ": " + (probability * 100).toFixed(0) + "%";
                
                const element = labelContainer.childNodes[i];
                element.innerHTML = classText;

                // Xử lý in đậm khi > 60% (0.6)
                if (probability > 0.6) {
                    element.classList.add("high-confidence");
                } else {
                    element.classList.remove("high-confidence");
                }
            }
        }
    </script>
</body>
</html>
