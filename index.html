<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cho Cuộc Sống Xanh</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. CĂN CHỈNH TOÀN BỘ TRANG */
        body {
            margin: 0;
            padding: 0;
            background-color: #e8f5e9; /* Nền xanh lá cây nhạt */
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; /* Căn giữa mọi thứ theo chiều ngang */
            min-height: 100vh;
        }

        /* 2. THANH TÁC VỤ NHỎ */
        .top-bar {
            font-size: 14px;
            color: #2e7d32;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. TIÊU ĐỀ CHÍNH */
        .main-title {
            font-family: 'Noto Serif Display', serif;
            font-size: 48px;
            margin: 10px 0 30px 0;
            color: #000;
            text-align: center;
        }
        .main-title span {
            color: #4caf50; /* Chữ cuộc sống xanh màu xanh lá */
        }

        /* 4. KHUNG BAO MÀU BEIGE */
        .app-container {
            background-color: #f5f5dc; /* Màu Beige */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px; /* Tăng độ rộng để chứa 2 cột */
            width: 90%;
            border: 2px solid #dcdcaa;
        }

        /* KHUNG CAMERA */
        #webcam-container {
            border: 8px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: #000;
            margin-bottom: 25px;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* NÚT BẤM */
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        button:hover {
            background-color: #388e3c;
            transform: scale(1.05);
        }

        /* 5. CHIA 2 CỘT CHO KẾT QUẢ (MỖI CỘT 3 CÁI) */
        #label-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Chia 2 cột đều nhau */
            gap: 15px; /* Khoảng cách giữa các ô */
        }

        #label-container div {
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #e0e0ce;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            transition: all 0.2s;
        }

        /* HIỆU ỨNG IN ĐẬM KHI ĐỘ CHÍNH XÁC > 60% */
        .high-confidence {
            background-color: #ffffff !important;
            border: 2px solid #4caf50 !important;
            font-weight: bold !important; /* IN ĐẬM */
            color: #1b5e20;
            transform: scale(1.05);
        }

        /* 6. CHÂN TRANG */
        .footer-link {
            margin: 30px 0;
            font-size: 16px;
            color: #555;
        }
        .footer-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #4caf50;
        }
    </style>
</head>
<body>

    <div class="top-bar">Phân loại rác thải tự động</div>
    
    <h1 class="main-title">AI cho <span>cuộc sống xanh</span></h1>

    <div class="app-container">
        <div id="webcam-container">
            <span style="color: #666;">Camera chưa sẵn sàng</span>
        </div>

        <button type="button" onclick="init()">Bắt đầu nhận diện</button>
        
        <div id="label-container">
            </div>
    </div>

    <div class="footer-link">
        Tham khảo cách xử lý rác <a href="https://canva.link/vjjnoiq5v52rytr" target="_blank">tại đây</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // LINK MODEL CỦA M
        const URL = "https://teachablemachine.withgoogle.com/models/KfJ6e8utrB/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(320, 320, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Hiện webcam vào khung
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const probability = prediction[i].probability;
                const classText = `<span>${prediction[i].className}</span> <span>${(probability * 100).toFixed(0)}%</span>`;
                
                const element = labelContainer.childNodes[i];
                element.innerHTML = classText;

                // Tự động in đậm và đổi màu nếu > 60%
                if (probability > 0.6) {
                    element.classList.add("high-confidence");
                } else {
                    element.classList.remove("high-confidence");
                }
            }
        }
    </script>
</body>
</html>
