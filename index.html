<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI cho cuộc sống xanh
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet"></title>
    <style>
      <style>
    /* 1. Thiết lập nền và font chữ chung */
    body {
        margin: 0;
        padding: 0;
        background-color: #e8f5e9; /* Xanh lá cây nhạt */
        font-family: 'Roboto', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* 2. Thanh tác vụ nhỏ bên trên */
    .top-bar {
        font-size: 14px;
        color: #2e7d32;
        margin-top: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* 3. Tiêu đề chính */
    .main-title {
        font-family: 'Noto Serif Display', serif;
        font-size: 48px;
        margin: 10px 0 30px 0;
        color: #000; /* "AI cho" màu đen */
    }
    .main-title span {
        color: #4caf50; /* "cuộc sống xanh" màu xanh lá */
    }

    /* 4. Khung bao màu Beige chứa nội dung chính */
    .app-container {
        background-color: #f5f5dc; /* Màu Beige */
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 600px;
        width: 90%;
        border: 2px solid #dcdcaa;
    }

    /* Khung hiển thị Webcam */
    #webcam-container {
        border: 8px solid #fff;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        background: #000;
        margin-bottom: 20px;
        width: 320px;
        height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Nút bấm */
    button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 25px;
    }
    button:hover {
        background-color: #388e3c;
        transform: scale(1.05);
    }

    /* 5. Khu vực hiển thị kết quả */
    #label-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    #label-container div {
        background: rgba(255, 255, 255, 0.6);
        padding: 12px 20px;
        border-radius: 8px;
        border: 1px solid #e0e0ce;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        transition: all 0.2s;
    }

    /* HIỆU ỨNG IN ĐẬM KHI > 60% */
    .high-confidence {
        background-color: #ffffff !important;
        border: 2px solid #4caf50 !important;
        font-weight: bold !important; /* In đậm nội dung */
        color: #1b5e20;
        transform: scale(1.02);
    }

    /* 6. Chân trang */
    .footer-link {
        margin-top: 30px;
        margin-bottom: 30px;
        font-size: 16px;
        color: #555;
    }
    .footer-link a {
        color: #2e7d32;
        text-decoration: none;
        font-weight: bold;
        border-bottom: 2px solid #4caf50;
    }
</style>
    </style>
</head>
<body>

    <div class="header">PHÂN LOẠI RÁC THẢI - IMAGE MODEL</div>

    <div class="web-description">
        <p>Ứng dụng sử dụng trí tuệ nhân tạo (CNN) để nhận diện và phân loại rác thải sinh hoạt trong thời gian thực. Hãy đưa rác lại gần camera để bắt đầu.</p>
    </div>

    <div class="container">
        <div id="webcam-container">
            <span style="color: #fff;">Camera sẽ hiện tại đây</span>
        </div>
        
        <button type="button" onclick="init()">Bắt đầu nhận diện</button>

        <div id="label-container" class="label-container">
            </div>

        <div class="footer-guide">
            <p>Để xử lý rác đúng cách, bạn có thể tham khảo <a href="LINK_HUONG_DAN_CUA_BAN" target="_blank">tại đây</a>.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/KfJ6e8utrB/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(320, 320, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Xóa chữ chờ và hiện camera
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // Xóa trắng trước khi hiện mới
            for (let i = 0; i < maxPredictions; i++) {
                let div = document.createElement("div");
                div.className = "label-item";
                div.innerHTML = `<span class="label-name"></span><span class="label-value">0.00</span>`;
                labelContainer.appendChild(div);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction = prediction[i].className;
                const probability = prediction[i].probability.toFixed(2);
                
                const item = labelContainer.childNodes[i];
                item.querySelector(".label-name").innerText = classPrediction;
                item.querySelector(".label-value").innerText = probability;

                // Highlight kết quả chính xác cao
                if (probability > 0.6) {
                    item.style.backgroundColor = "#e8f0fe";
                    item.style.borderColor = "#3f51b5";
                } else {
                    item.style.backgroundColor = "#f8f9fa";
                    item.style.borderColor = "#ddd";
                }
            }
        }
    </script>
</body>
</html>
